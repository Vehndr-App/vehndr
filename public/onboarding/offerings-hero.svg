<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Event + vendor handshake concept -->
  <defs>
    <linearGradient id="offerGrad1" x1="0" y1="0" x2="80" y2="80">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="offerGrad2" x1="0" y1="0" x2="40" y2="40">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <circle cx="40" cy="40" r="38" fill="url(#offerGrad1)" opacity="0.15"/>
  <circle cx="40" cy="40" r="30" fill="url(#offerGrad1)" opacity="0.2"/>
  <!-- Calendar/event icon -->
  <rect x="20" y="18" width="16" height="14" rx="2" fill="white" opacity="0.3"/>
  <rect x="24" y="22" width="8" height="6" rx="1" fill="url(#offerGrad1)"/>
  <!-- Vendor/store icon -->
  <rect x="44" y="18" width="16" height="14" rx="2" fill="white" opacity="0.3"/>
  <path d="M48 24h8v2h-8v-2zm0 4h6v2h-6v-2z" fill="url(#offerGrad2)"/>
  <!-- Handshake line -->
  <path d="M36 32 L44 32" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="40" cy="32" r="3" fill="white"/>
</svg>
